name: Compress Videos

on:
  workflow_dispatch: # Manuel tetikleme

jobs:
  compress:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg || sudo snap install ffmpeg

      - name: Compress all MP4 videos
        run: |
          FAILED_FILES=()
          SUCCESS_COUNT=0

          for dir in test{1..50}; do
            if [ -d "$dir" ]; then
              for video in "$dir"/*.mp4; do
                if [ -f "$video" ]; then
                  echo "Processing: $video"
                  tmpfile="${video%.mp4}_tmp.mp4"

                  # Bozuk dosya kontrolü
                  if ! ffprobe -v error -select_streams v -show_entries stream=codec_type \
                      -of default=noprint_wrappers=1 "$video" 2>/dev/null | grep -q "codec_type=video"; then
                    echo "❌ BOZUK (geçerli video stream yok): $video"
                    FAILED_FILES+=("$video — geçerli video stream yok (bozuk dosya)")
                    continue
                  fi

                  ffmpeg -i "$video" \
                    -c:v libx265 \
                    -crf 28 \
                    -preset medium \
                    -vf "scale=854:480" \
                    -an \
                    "$tmpfile" -y 2>/dev/null

                  if [ -f "$tmpfile" ] && [ -s "$tmpfile" ]; then
                    mv "$tmpfile" "$video"
                    echo "✅ Tamam: $video"
                    SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                  else
                    rm -f "$tmpfile"
                    echo "❌ BAŞARISIZ (ffmpeg hatası): $video"
                    FAILED_FILES+=("$video — ffmpeg sıkıştırma başarısız")
                  fi
                fi
              done
            fi
          done

          echo ""
          echo "=============================="
          echo "✅ Sıkıştırıldı: $SUCCESS_COUNT dosya"
          echo "❌ Hatalı: ${#FAILED_FILES[@]} dosya"
          echo "=============================="

          echo "## 📊 Video Sıkıştırma Raporu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Başarıyla sıkıştırıldı:** $SUCCESS_COUNT dosya" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Hatalı / Bozuk:** ${#FAILED_FILES[@]} dosya" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ${#FAILED_FILES[@]} -gt 0 ]; then
            echo "## ❌ Hatalı / Bozuk Dosyalar" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for f in "${FAILED_FILES[@]}"; do
              echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY
              echo "  ❌ $f"
            done
          fi

      - name: Commit and push compressed videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: compress videos with FFmpeg H.265 480p"
          git push
