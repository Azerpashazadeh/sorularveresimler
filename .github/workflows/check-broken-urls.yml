name: Check Broken URLs in JSON Files

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check for incomplete URLs in all JSON files
        run: |
          python3 << 'EOF'
          import os
          import json
          import re

          BASE_URL = "https://azerpashazadeh.github.io/sorularveresimler/"
          report = []

          def check_value(value, path, soru_no, issues):
              if isinstance(value, str):
                  if value.strip() == BASE_URL:
                      issues.append(f"  - Soru #{soru_no} → {path}: \"{value}\"")
              elif isinstance(value, list):
                  for i, item in enumerate(value):
                      check_value(item, f"{path}[{i}]", soru_no, issues)
              elif isinstance(value, dict):
                  for k, v in value.items():
                      check_value(v, f"{path}.{k}", soru_no, issues)

          for test_dir in sorted(os.listdir("."), key=lambda x: int(re.search(r'\d+', x).group()) if re.search(r'\d+', x) else 0):
              if not re.match(r"^test\d+$", test_dir):
                  continue
              for lang_dir in ["arabicjsons", "dutchjsons", "englishjsons", "turkishjsons"]:
                  lang_path = os.path.join(test_dir, lang_dir)
                  if not os.path.isdir(lang_path):
                      continue
                  for filename in sorted(os.listdir(lang_path)):
                      if not filename.endswith(".json"):
                          continue
                      filepath = os.path.join(lang_path, filename)
                      try:
                          with open(filepath, "r", encoding="utf-8") as f:
                              data = json.load(f)
                      except Exception as e:
                          report.append(f"\n❌ OKUNAMADI: {filepath} → {e}")
                          continue

                      sorular = data.get("sorular", [])
                      file_issues = []
                      for soru in sorular:
                          soru_no = soru.get("numara", "?")
                          for key, val in soru.items():
                              check_value(val, key, soru_no, file_issues)

                      if file_issues:
                          report.append(f"\n📄 {filepath}")
                          report.extend(file_issues)

          # Konsol çıktısı
          print("=" * 60)
          if report:
              print("⚠️  Eksik URL bulunan dosyalar:\n")
              print("\n".join(report))
          else:
              print("✅ Hiçbir dosyada eksik URL bulunamadı.")
          print("=" * 60)

          # GitHub Summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "w", encoding="utf-8") as f:
                  if report:
                      f.write("## ⚠️ Eksik URL Bulunan Dosyalar\n\n")
                      f.write("```\n")
                      f.write("\n".join(report))
                      f.write("\n```\n")
                  else:
                      f.write("## ✅ Tüm dosyalarda URL'ler tam!\n")
          EOF
